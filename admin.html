<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WanderReads — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:#f5f8f7}.admin-shell{min-height:100vh}.admin-top{height:70px;padding:0 4%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.admin-top .brand{min-width:auto}.admin-main{max-width:1320px;margin:auto;padding:28px 4% 50px}.admin-layout{display:grid;grid-template-columns:210px 1fr;gap:25px}.admin-side{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;height:max-content;position:sticky;top:95px}.admin-side button{width:100%;padding:11px 12px;margin:2px 0;text-align:left;border-radius:6px;background:transparent;color:var(--ink);font-size:12px}.admin-side button.active,.admin-side button:hover{background:var(--soft);color:var(--teal);font-weight:700}.admin-view{display:none}.admin-view.active{display:block}.admin-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.admin-title h1{margin:4px 0 0;font:600 32px "Playfair Display",serif}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{padding:18px;background:#fff;border:1px solid var(--line);border-radius:9px}.stat small{color:var(--muted);font-size:10px}.stat strong{display:block;margin-top:5px;font-size:24px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}.admin-card h2{margin:0 0 15px;font:600 20px "Playfair Display",serif}.admin-table{width:100%;border-collapse:collapse;font-size:11px}.admin-table th,.admin-table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.admin-table th{color:var(--muted);font-size:10px}.table-actions{display:flex;gap:5px}.tiny-btn{padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:9px}.tiny-btn:hover{border-color:var(--teal);color:var(--teal)}.tiny-btn.danger{color:var(--danger)}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.admin-form label{display:grid;gap:5px;font-size:10px;font-weight:700}.admin-form input,.admin-form select{padding:9px;border:1px solid var(--line);border-radius:5px;outline:0;font-size:11px}.admin-form .wide{grid-column:1/-1}.admin-actions{grid-column:1/-1;display:flex;gap:8px}.notice{padding:11px;border-radius:6px;background:#fff8e8;color:#715718;font-size:10px;margin-bottom:15px}.status{display:inline-block;padding:4px 7px;border-radius:10px;background:var(--soft);color:var(--teal);font-size:9px;font-weight:700}.status.cancelled{background:#fdebed;color:var(--danger)}.status.shipped{background:#eef1ff;color:#4352a2}.admin-empty{text-align:center;color:var(--muted);padding:30px}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(410px,100%);padding:30px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.login-card h1{font:600 30px "Playfair Display",serif;margin:5px 0 8px}.login-card p{color:var(--muted);font-size:11px}.login-card form{display:grid;gap:12px;margin-top:20px}.login-card label{display:grid;gap:5px;font-size:10px;font-weight:700}.login-card input{padding:10px;border:1px solid var(--line);border-radius:6px}.admin-error{color:var(--danger);font-size:10px;min-height:15px}
@media(max-width:900px){.admin-layout{grid-template-columns:1fr}.admin-side{position:static;display:flex;overflow:auto}.admin-side button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.admin-main{padding:20px 4%}.admin-form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.admin-table{min-width:720px}.admin-card.table-wrap{overflow:auto}.admin-title{display:block}.admin-title .btn{margin-top:10px}}
</style>
</head>
<body>
<div id="adminApp"></div>
<script src="admin.js" defer></script>
</body>
</html>
